<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>What?</title>
        <link rel="stylesheet" href="styles.css" type="text/css" media="all" />
        <script src="script.js"></script>
        <style>
            body {
                background-color: #000000;
                height: 100vh;
                width: 100vw;
                padding: 0px;
                margin: 0px;
            }
            h1 {
                color: white;
                height: auto;
                width: auto;
                font-weight: lighter;
                font-size: 25px;
                font-family: "Times New Roman";
                align-content: center; /*up-down*/
                text-align-last: center; /*left-right*/
                margin: 0px;
                padding: 0px;
            }
            p {
                color: white;
                height: auto;
                width: auto;
                font-weight: lighter;
                font-size: 30px;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                align-self: center;
                margin: 0px;
                padding: 0px;
            }
            small {
                color: white;
                height: auto;
                width: auto;
                font-size: 10px;
                font-weight: bold;
                letter-spacing: 1.5px;
                margin: 0px;
                padding: 0px;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                align-self: center;
            }
            ::selection {
                background-color: #ffffff40;
                text-decoration: underline;
            }
            #container {
                background-color: transparent;
                height: 100vh;
                width: 100vw;
                padding: 0px;
                margin: 0px;
                display: flex;
                align-items: center; /*up-down*/
                justify-content: center; /*left-right*/
                z-index: 0;
            }
            #background {
                margin: 0px;
                padding: 0px;
                height: 100%;
                width: 100%;
                object-fit: cover;
                position: absolute;
                z-index: -1;
            }
            #header {
                background-color: black;
                color: white;
                border: none;
                border-bottom: solid;
                height: 50px;
                width: 100%;
                margin: 0px;
                padding: 0px;
                align-content: center; /*up-down*/
                text-align-last: center; /*left-right*/
                position: absolute;
                top: 0px;
                z-index: 999;
            }
            .titlebar1 {
                background-color: black;
                color: white;
                border: double;
                border-width: thick;
                border-top-width: medium;
                border-bottom: none;
                height: 0px;
                width: auto;
                margin: 0px;
                /* */
                padding: 10px;
                /* */
                display: flex;
                align-items: center; /*up-down*/
                justify-content: left; /*left-right*/
            }
            .window1 {
                background: black;
                color: white;
                border: double;
                border-width: thick;
                border-top-width: medium;
                border-bottom-width: medium;
                height: fit-content;
                width: fit-content;
                margin: 0px;
                padding: 10px;
                display: flex;
                justify-content: center;
                flex-direction: column;
            }
            .window1-stack {
                background: transparent;
                color: transparent;
                border: none;
                height: fit-content;
                width: fit-content;
                margin: 0px;
                padding: 0px;
                /* */
                display: flex;
                justify-content: center;
                flex-direction: column;
            }
            .subcontainer1 {
                background: black;
                color: white;
                border: none;
                height: fit-content;
                width: fit-content;
                margin: 0px;
                padding: 0px;
                /* */
                display: flex;
                align-items: center; /*up-down*/
                justify-content: center; /*left-right*/
            }
            .subcontainer-row {
                background: black;
                color: white;
                border: none;
                height: fit-content;
                width: fit-content;
                margin: 0px;
                padding: 0px;
                /* */
                display: flex;
                justify-content: center;
                flex-direction: row;
            }
            .subcontainer-col {
                background: black;
                color: white;
                border: none;
                height: fit-content;
                width: fit-content;
                margin: 0px;
                padding: 0px;
                /* */
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }
            .advertise-right {
                background-color: #ff0000;
                border: solid;
                border-color: white;
                width: 150px;
                height: 300px;
                padding: 0px;
                margin: 0px;
            }
            .v-divider {
                background-color: white;
                height: auto;
                width: 1px;
                margin: 5px;
                /* */
                margin-top: 0px;
                margin-bottom: 0px;
                padding: 0px;
            }
            .h-divider {
                background-color: white;
                height: 1px;
                width: 100%;
                margin: 5px;
                /* */
                margin-left: 0px;
                margin-right: 0px;
                padding: 0px;
            }
            .v-border {
                background-color: black;
                height: auto;
                width: 5px;
                margin: 0px;
                /* */
                margin-left: 0px;
                margin-right: 0px;
                padding: 0px;
            }
            .h-border {
                background-color: black;
                height: 5px;
                width: auto;
                margin: 0px;
                /* */
                margin-left: 0px;
                margin-right: 0px;
                padding: 0px;
            }
            .advertise-right img {
                height: 100%;
                width: 100%;
                padding: 0px;
                margin: 0px;
            }
        </style>
    </head>
